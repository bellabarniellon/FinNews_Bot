name: news-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub иногда запускает с задержкой)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check news
        run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ONLY_KEYWORDS: ${{ vars.ONLY_KEYWORDS }}
      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
