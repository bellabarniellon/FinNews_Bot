name: bonds-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # алерты каждые ~10 мин (на странице KASE видно только 10 последних новостей); кривая — по будням после 18:30 Алматы
  workflow_dispatch:
    inputs:
      report:
        description: "Отправить отчёт по кривой прямо сейчас"
        type: boolean
        default: false
      dry_run:
        description: "Тест без Telegram: посты только в лог запуска"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bonds-bot${{ inputs.dry_run && '-dry' || '' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install --quiet numpy matplotlib openpyxl
      - name: Check bonds
        run: python bonds.py --once ${{ inputs.report && '--report' || '' }} ${{ inputs.dry_run && '--sample' || '' }}
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_BONDS: ${{ secrets.TG_CHAT_BONDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "bonds-bot"
          git config user.email "bonds-bot@users.noreply.github.com"
          git add bonds_state.json
          git diff --cached --quiet && exit 0
          git commit -m "update bonds state"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
